<script>
/* ===================== CONFIG ===================== */
const SUPABASE_URL = 'https://hbttxvanyqczspljtqpz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_J4abyTF0BPq47eBTVLjIFQ_5-x2HOiJ';
const BUCKET = 'cheques-archivos';
const PAGE = 40;
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

/* ===================== ESTADO ===================== */
const S = { perfil: null, cargos: [], chequeras: [], series: {}, tab: 'pend', filt: { q: '', chequera: '' },
            list: [], count: 0, page: 0, pendCount: 0, F: null };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => '$' + Number(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const cents = n => Math.round(Number(n || 0) * 100);
const fdate = d => { if (!d) return ''; const [y, m, dd] = String(d).slice(0, 10).split('-'); return `${dd}/${m}/${y}`; };
const fdt = d => d ? new Date(d).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }) : '';
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const parseMoney = s => { const n = Number(String(s ?? '').replace(/[$,\s]/g, '')); return isFinite(n) ? n : NaN; };
const pad = (n, l = 4) => String(n).padStart(l, '0');
const rol = () => S.perfil?.rol;
const puedeCapturar = () => ['administrador', 'capturista'].includes(rol());
const esAdmin = () => rol() === 'administrador';
const cargoNombre = id => S.cargos.find(c => c.id === id)?.nombre || '?';
const chequeraNombre = id => S.chequeras.find(c => c.id === id)?.nombre || '?';

function toast(msg, type = '') {
  const t = $('#toast'); t.textContent = msg; t.className = type; clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('hidden'), type === 'err' ? 6500 : 3000);
}
const errMsg = e => (e && (e.message || e.error_description)) || String(e);
async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args);
  if (error) throw error;
  return data;
}
function openModal(html) { $('#modal').innerHTML = `<div class="overlay" data-act="ovl"><div class="sheet"><button class="x" data-act="close">×</button>${html}</div></div>`; }
function closeModal() { $('#modal').innerHTML = ''; }

function estadoChip(c) {
  if (c.es_historial) return '<span class="chip historial">Historial</span>';
  if (c.estatus === 'autorizado') return c.cobrado ? '<span class="chip cobrado">Cobrado</span>' : '<span class="chip autorizado">Autorizado · por cobrar</span>';
  return `<span class="chip ${c.estatus}">${{ pendiente: 'Pendiente de autorizar', rechazado: 'Rechazado', cancelado: 'Cancelado' }[c.estatus]}</span>`;
}
const ICON = {
  pend: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>',
  cheques: '<svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 10h16M8 15h4"/></svg>',
  nuevo: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  bit: '<svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></svg>',
  money: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
  empty: '<svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6"/></svg>'
};
const rolTxt = r => ({ capturista: 'Administración', administrador: 'Administrador', contador: 'Contador' }[r] || r);
const iniciales = n => String(n || '?').replace(/^ING\.\s*/i, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const fdia = d => { const [y, m, dd] = d.split('-'); const M = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']; return `${Number(dd)} de ${M[Number(m) - 1]} de ${y}`; };
const foliosActivos = c => (c.cheque_folios || []).filter(f => f.activo);
const sumFolios = c => foliosActivos(c).reduce((a, f) => a + cents(f.monto), 0);
const archActivos = (c, tipo) => (c.archivos || []).filter(a => a.activo && (!tipo || a.tipo === tipo));

/* ===================== NUMERO A LETRA ===================== */
function montoLetra(n) {
  const U = ['', 'UN', 'DOS', 'TRES', 'CUATRO', 'CINCO', 'SEIS', 'SIETE', 'OCHO', 'NUEVE', 'DIEZ', 'ONCE', 'DOCE', 'TRECE', 'CATORCE', 'QUINCE', 'DIECISEIS', 'DIECISIETE', 'DIECIOCHO', 'DIECINUEVE', 'VEINTE', 'VEINTIUN', 'VEINTIDOS', 'VEINTITRES', 'VEINTICUATRO', 'VEINTICINCO', 'VEINTISEIS', 'VEINTISIETE', 'VEINTIOCHO', 'VEINTINUEVE'];
  const D = ['', '', '', 'TREINTA', 'CUARENTA', 'CINCUENTA', 'SESENTA', 'SETENTA', 'OCHENTA', 'NOVENTA'];
  const C = ['', 'CIENTO', 'DOSCIENTOS', 'TRESCIENTOS', 'CUATROCIENTOS', 'QUINIENTOS', 'SEISCIENTOS', 'SETECIENTOS', 'OCHOCIENTOS', 'NOVECIENTOS'];
  const m1000 = x => { if (x === 100) return 'CIEN'; let s = ''; const c = Math.floor(x / 100), r = x % 100; if (c) s += C[c] + ' '; if (r < 30) s += U[r]; else { const d = Math.floor(r / 10), u = r % 10; s += D[d] + (u ? ' Y ' + U[u] : ''); } return s.trim(); };
  const total = Math.round(Number(n) * 100); const ent = Math.floor(total / 100), cc = total % 100;
  let s = '';
  if (ent === 0) s = 'CERO';
  else {
    const mill = Math.floor(ent / 1e6), mil = Math.floor((ent % 1e6) / 1000), r = ent % 1000;
    if (mill) s += (mill === 1 ? 'UN MILLON' : m1000(mill) + ' MILLONES') + ' ';
    if (mil) s += (mil === 1 ? 'MIL' : m1000(mil) + ' MIL') + ' ';
    if (r) s += m1000(r);
    s = s.trim();
  }
  const sufijo = ent === 1 ? 'PESO' : (ent > 0 && ent % 1e6 === 0 ? 'DE PESOS' : 'PESOS');
  return `${s} ${sufijo} ${String(cc).padStart(2, '0')}/100 M.N.`;
}

/* ===================== AUTENTICACION ===================== */
const EYE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
const pwField = (id, ac) => `<div class="pw"><input type="password" id="${id}" autocomplete="${ac}" required><button type="button" class="eye" data-act="verpass" data-for="${id}" aria-label="Mostrar u ocultar contraseña" title="Mostrar / ocultar">${EYE}</button></div>`;
function renderLogin(msg = '') {
  $('#app').innerHTML = `
  <div class="login">
    <div class="logo"><b>JOCRIS</b><span>Control de Cheques</span></div>
    <div class="box">
      <form id="fLogin">
        <label class="f">Correo</label><input type="email" id="lgMail" autocomplete="username" required>

        <p class="mut sm" style="text-align:center;margin:14px 0 0">Acceso solo para usuarios autorizados.</p>
      </form>
    </div>
  </div>`;
  $('#fLogin').onsubmit = async ev => {
    ev.preventDefault(); const b = $('#lgBtn'); b.disabled = true; b.textContent = 'Entrando…';
    const mail = $('#lgMail').value.trim().toLowerCase();

    try { ({ error } = await sb.auth.signInWithPassword({ email: mail, password: $('#lgPass').value })); } catch (e) { error = e; }

        : 'No se pudo entrar: ' + m); return;
    }

  };

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  const { data: p } = await sb.from('perfiles').select('*').eq('id', session.user.id).maybeSingle();
  if (!p || !p.activo) { await sb.auth.signOut(); return renderLogin('Tu usuario no está activo en el sistema. Avísale a Pedro.'); }
  S.perfil = p;
  $('#app').innerHTML = '<div class="spin">Cargando…</div>';
  await loadCatalogs();
  try { const { data: fr } = await sb.from('firmas').select('imagen').maybeSingle(); S.firma = fr ? fr.imagen : null; } catch (e) { S.firma = null; }
  S.tab = esAdmin() ? 'pend' : 'cheques';
  renderShell();
  refreshPendCount();

async function loadCatalogs() {
  const [a, b, c] = await Promise.all([

async function refreshPendCount() {
  const [r1, r2] = await Promise.all([

async function loadList(reset) {
  const f = S.filt; if (reset) { S.page = 0; S.list = []; $('#lst').innerHTML = '<div class="spin">Cargando…</div>'; }
  let q = sb.from('cheques').select(SEL, { count: 'exact' });
  if (f.chequera) q = q.eq('chequera_id', Number(f.chequera));
  if (f.q) {
    const term = f.q.replace(/[,()%*]/g, ' ').trim(); const conds = [`beneficiario.ilike.%${term}%`, `concepto.ilike.%${term}%`];
    if (/^\d+$/.test(term) && term.length < 10) { conds.push(`numero_cheque.eq.${term}`); }
    const { data: fo } = await sb.from('cheque_folios').select('cheque_id').eq('activo', true).or(`folio_numero.ilike.${term},proveedor.ilike.%${term}%`).limit(200);
    const ids = [...new Set((fo || []).map(x => x.cheque_id))];
    if (ids.length) conds.push(`id.in.(${ids.join(',')})`);
    q = q.or(conds.join(','));
  }
  // Siempre del más reciente al más antiguo.
  q = q.order('fecha', { ascending: false }).order('creado_en', { ascending: false }).order('numero_cheque', { ascending: false }).range(S.page * PAGE, S.page * PAGE + PAGE - 1);
  const { data, error, count } = await q;
  if (error) { $('#lst').innerHTML = `<div class="warnbox">${esc(errMsg(error))}</div>`; return; }
  S.count = count; S.list = S.list.concat(data); S.page++;
  const hc = $('#hcount'); if (hc) hc.textContent = (count || 0) + ' cheque(s)';
  if (!f.q) {
    const { data: pc } = await sb.from('cheques').select('monto').eq('es_historial', false).eq('estatus', 'autorizado').eq('cobrado', false);
    const tot = (pc || []).reduce((a, x) => a + cents(x.monto), 0) / 100;
    $('#resumen').innerHTML = (pc || []).length ? `<div class="card summary"><div class="ico">${ICON.money}</div><div class="grow"><div class="mut sm">Autorizados por cobrar</div><div class="money big">${fmt(tot)}</div></div><div class="mut sm">${(pc || []).length} cheque(s)</div></div>` : '';
  } else $('#resumen').innerHTML = '';
  let ult = null;
  const html = S.list.map(c => { const d = String(c.fecha).slice(0, 10); const h = d !== ult ? `<div class="dayh">${fdia(d)}</div>` : ''; ult = d; return h + rowCheque(c); }).join('');
  $('#lst').outerHTML = `<div id="lst">${S.list.length ? html : `<div class="card empty">${ICON.empty}<div>Sin resultados.</div></div>`}</div>`;
  $('#more').innerHTML = S.list.length < S.count ? `<button class="btn ghost" data-act="mas">Ver más (${S.list.length} de ${S.count})</button>` : '';
}
function rowCheque(c) {

      ${cuadra ? '<div class="okbox">Folios y cheque cuadran al centavo.</div>' : `<div class="warnbox">No cuadra: folios ${fmt(sumFolios(c) / 100)} vs cheque ${fmt(c.monto)}.</div>`}`}
      <h3>Documentos</h3><div class="card files">
        ${arch.length ? arch.map(a => `<div class="row" style="margin-bottom:6px"><span class="chip historial">${tipoTxt[a.tipo]}</span><button class="lnk grow" style="text-align:left" data-act="verpath" data-path="${esc(a.path)}">${esc(a.nombre || 'archivo')}</button>${puedeCapturar() ? `<button class="btn ghost sm" data-act="quitar" data-id="${a.id}">Quitar</button>` : ''}</div>`).join('') : '<span class="mut">Aún no hay documentos.</span>'}
        ${puedeSubir ? `<div class="row" style="margin-top:10px">
          ${puedeCapturar() && c.estatus !== 'cancelado' ? `<button class="btn ghost sm" data-act="subir" data-id="${id}" data-tipo="factura">+ Factura</button><button class="btn ghost sm" data-act="subir" data-id="${id}" data-tipo="folio">+ Folio</button>` : ''}
          ${c.estatus === 'autorizado' && ['administrador', 'capturista', 'contador'].includes(rol()) ? `<button class="btn ghost sm" data-act="subir" data-id="${id}" data-tipo="comprobante_cobro">+ Comprobante de cobro</button>` : ''}
          ${puedeCapturar() ? `<button class="btn ghost sm" data-act="subir" data-id="${id}" data-tipo="otro">${c.estatus === 'cancelado' ? '+ Foto del cheque cancelado' : '+ Otro'}</button>` : ''}</div>` : ''}
      </div>
      ${acciones ? `<div class="row" style="margin:12px 0">${acciones}</div>` : ''}
      <h3>Bitácora</h3><div>${(bit || []).map(b => `<div class="log"><b>${esc(b.accion.replace(/_/g, ' '))}</b> · ${esc(b.usuario_nombre || '')}<br><span class="mut">${fdt(b.creado_en)}</span></div>`).join('') || '<span class="mut">Sin movimientos</span>'}</div>
    `);
  } catch (e) { openModal(`<div class="warnbox">${esc(errMsg(e))}</div>`); }
}

/* ===================== ARCHIVOS ===================== */
function pickFiles(multiple = true) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*,application/pdf'; i.multiple = multiple;
    i.onchange = () => res([...i.files]); i.click();
  });
}
function loadImg(file, maxDim = 1800) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => {
      let { width: w, height: h } = im; const k = Math.min(1, maxDim / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url); res({ data: cv.toDataURL('image/jpeg', 0.82), w, h });
    };
    im.onerror = () => rej(new Error('No se pudo leer la imagen.')); im.src = url;
  });
}
async function filesToPdf(files) {
  if (files.length === 1 && files[0].type === 'application/pdf') return files[0];
  if (files.some(f => f.type === 'application/pdf')) throw new Error('No mezcles PDFs con fotos: sube el PDF solo.');
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: 'a4' }); let first = true;
  for (const f of files) {
    const im = await loadImg(f); if (!first) doc.addPage(); first = false;
    const pw = 210, ph = 297, m = 8, r = Math.min((pw - 2 * m) / im.w, (ph - 2 * m) / im.h);
    doc.addImage(im.data, 'JPEG', m + ((pw - 2 * m) - im.w * r) / 2, m, im.w * r, im.h * r);
  }
  return doc.output('blob');
}
async function subirArchivo(chequeId, tipo, files, nombreFijo) {
  const blob = await filesToPdf(files);
  const path = `${chequeId}/${tipo}-${Date.now()}.pdf`;
  const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: 'application/pdf' });
  if (up.error) throw up.error;
  const nombre = nombreFijo || (files.length === 1 ? files[0].name.replace(/\.(jpe?g|png|webp|heic)$/i, '.pdf') : `${tipo}-${files.length}-fotos.pdf`);
  await rpc('registrar_archivo', { p_cheque: chequeId, p_tipo: tipo, p_path: path, p_nombre: nombre });
}
async function abrirPath(path) {
  const w = window.open('', '_blank');
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 300);
  if (error) { if (w) w.close(); return toast(errMsg(error), 'err'); }
  if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
}

function folioPDF(jsPDF, d) {
  // d: {fecha:'YYYY-MM-DD', cargo, folios:[{folio,vencimiento,conceptos:[...],monto}], nombre, periodo, solicito, firma(dataURL|null), autorizo}
  const doc = new jsPDF({ unit: 'mm', format: 'letter' });

  const C1 = 34, C3 = 40, C2 = W - C1 - C3; // izq (folio/venc), centro (concepto), der (cantidad)
  const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const fl = s => { if (!s) return ''; const [y, m, dd] = String(s).slice(0, 10).split('-'); return `${Number(dd)} de ${MES[Number(m) - 1]} de ${y}`; };

    const conc = (f.conceptos || []).filter(Boolean).flatMap(c => doc.setFont(F, 'normal') && doc.setFontSize(10.5) && doc.splitTextToSize(String(c).toUpperCase(), C2 - 6));
    const left = varios ? 4 : (f.vencimiento ? 2 : 0);
    return { f, conc, rows: Math.max(conc.length, left, 2) + (varios ? 1 : 0) };
  });
  let rowsUsed = items.reduce((a, it) => a + it.rows, 0); const totRows = Math.max(rowsUsed, varios ? 12 : 10);
  const y0 = 28;
  // logo
  if (d.logo) { try { doc.addImage(d.logo, 'PNG', X + 3, y0 - 15.5, 40, 40 * (d.logoRatio || 0.27)); } catch (e) {} }
  // fecha
  txt(fl(d.fecha), X + W - 4, y0 - 6, 12, false, { align: 'right' });
  // fila cargo | FOLIO | numero
  const hY = y0, hH = 9, c1 = 34, c2 = 58, c3 = 64;
  doc.setDrawColor(0); doc.setLineWidth(0.7);
  doc.rect(X, hY, c1 + c2 + c3, hH); line(X + c1, hY, X + c1, hY + hH, 0.7); line(X + c1 + c2, hY, X + c1 + c2, hY + hH, 0.7);
  txt(d.cargo, X + c1 / 2, hY + 6.2, 13, true, { align: 'center' });
  txt('FOLIO', X + c1 + c2 / 2, hY + 6.2, 13, true, { align: 'center' });
  const numTxt = varios ? d.folios.map(f => f.folio).join(', ') : d.folios[0].folio;
  txt(doc.splitTextToSize(String(numTxt), c3 - 4)[0], X + c1 + c2 + c3 / 2, hY + 6.2, varios ? 9 : 13, true, { align: 'center' });
  // nombre
  const nY = hY + hH + 4; line(X, nY, X + W, nY, 0.5);
  const nl = doc.setFont(F, 'bold') && doc.setFontSize(15) && doc.splitTextToSize(String(d.nombre || '').toUpperCase(), W - 20);
  const nH = Math.max(18, nl.length * 7 + 8);
  nl.forEach((t, i) => txt(t, X + W / 2, nY + 8 + i * 7, 15, true, { align: 'center' }));
  const tY = nY + nH; line(X, tY, X + W, tY, 0.5);
  let y = tY;
  if (d.periodo) { txt('PERIODO: ' + String(d.periodo).toUpperCase(), X + 2, y + 4.2, 9.5, true); y += RH; line(X, y, X + W, y, 0.4); }
  const tableTop = y;
  // tabla
  let r = 0; const yRow = k => tableTop + k * RH;
  items.forEach((it, idx) => {
    const base = r;
    if (varios) {
      txt('FOLIO', X + C1 / 2, yRow(base) + 3.9, 10, false, { align: 'center' });
      txt(it.f.folio, X + C1 / 2, yRow(base + 1) + 3.9, 10.5, true, { align: 'center' });
      txt('VENCIMIENTO', X + C1 / 2, yRow(base + 2) + 3.9, 10, false, { align: 'center' });
      txt(it.f.vencimiento ? fl(it.f.vencimiento) : '', X + C1 / 2, yRow(base + 3) + 3.9, 9, false, { align: 'center' });
    } else if (it.f.vencimiento) {
      txt('VENCIMIENTO', X + C1 / 2, yRow(base) + 3.9, 10, false, { align: 'center' });
      txt(fl(it.f.vencimiento), X + C1 / 2, yRow(base + 1) + 3.9, 9, false, { align: 'center' });
    }
    it.conc.forEach((t, i) => txt(t, X + C1 + C2 / 2, yRow(base + i) + 3.9, 10.5, false, { align: 'center' }));
    txt(money(it.f.monto), X + W - 6, yRow(base) + 3.9, 11, false, { align: 'right' });
    r += it.rows;
    if (varios && idx < items.length - 1) line(X, yRow(r), X + W, yRow(r), 0.5);
  });
  const nRows = totRows + 1; // + renglón TOTAL
  for (let k = 0; k <= nRows; k++) line(X, yRow(k), X + W, yRow(k), k === nRows - 1 || k === nRows ? 0.5 : 0.2, k === nRows - 1 || k === nRows ? [] : [0.5, 0.5]);
  const bottom = yRow(nRows);
  line(X + C1, tableTop, X + C1, bottom, 0.25, [0.6, 0.6]); line(X + C1 + C2, tableTop, X + C1 + C2, bottom, 0.25, [0.6, 0.6]);
  const total = d.folios.reduce((a, f) => a + Math.round(f.monto * 100), 0) / 100;
  txt('TOTAL', X + C1 + C2 - 4, yRow(nRows - 1) + 4, 11.5, true, { align: 'right' });
  txt(money(total), X + W - 6, yRow(nRows - 1) + 4, 12, true, { align: 'right' });
  // pie: firma encima de SOLICITO; SOLICITO a la izquierda y AUTORIZO a la derecha, en la misma línea
  const fY = bottom; const footH = 38;
  if (d.firma) { try { doc.addImage(d.firma, 'PNG', X + 8, fY + 3, 38, 23.2); } catch (e) {} }
  txt('SOLICITO: ' + String(d.solicito || '').toUpperCase(), X + 4, fY + 32, 11.5, false);
  txt('AUTORIZO: ' + String(d.autorizo || 'ING. JOSE CRISTOBAL GARCIA PERALES').toUpperCase(), X + W - 4, fY + 32, 11.5, false, { align: 'right' });

}

      && (f.proveedor || '') === prov && (!String(l.folio_numero || '').trim() || String(f.folio_numero) === String(l.folio_numero).trim()));
    if (i < 0) return null; usados.add(i); return folios[i];
  });
}
// Arma las hojas: mismo cargo + mismo proveedor = una hoja VARIOS (máx. 9); uno solo = UNICO.
const conceptosDe = l => { const a = String(l.conceptos || '').split('\n').map(t => t.trim()).filter(Boolean); return a.length ? a : [l.descripcion || ''].filter(Boolean); };
function armarHojas(lines, folios, h) {
  const par = emparejarFolios(lines, folios), grupos = {};
  lines.forEach((l, i) => {
    if (l.modo !== 'sistema' || !par[i]) return;
    const k = Number(l.cargo_id) + '|' + (l.proveedor || '').trim().toUpperCase();
    (grupos[k] = grupos[k] || []).push({ l, f: par[i] });
  });
  const hojas = [];
  Object.values(grupos).forEach(g => { for (let i = 0; i < g.length; i += 9) hojas.push(g.slice(i, i + 9)); });
  return hojas.map(g => {
    const cargo = cargoNombre(Number(g[0].l.cargo_id));
    const periodo = (g.find(x => (x.l.periodo || '').trim()) || { l: {} }).l.periodo || '';
    const mismoNombre = (g[0].l.proveedor || '').trim();
    const firmaOk = S.firma && String(h.solicito || '').trim().toLowerCase() === String(S.perfil.nombre || '').trim().toLowerCase();
    const doc = folioPDF(window.jspdf.jsPDF, {
      logo: LOGO_JOCRIS, logoRatio: 0.262, fecha: today(), cargo, nombre: mismoNombre, periodo, solicito: h.solicito || S.perfil.nombre,
      firma: firmaOk ? S.firma : null, autorizo: 'ING. JOSE CRISTOBAL GARCIA PERALES',
      folios: g.map(x => ({ folio: x.f.folio_numero, vencimiento: x.l.venc || '', monto: Number(x.f.monto),
        conceptos: conceptosDe(x.l) }))
    });
    const nums = g.map(x => x.f.folio_numero).join('-');
    return { doc, nombre: `Folio_${cargo.replace(/[^A-Za-z0-9]+/g, '_')}_${String(nums).replace(/[^A-Za-z0-9-]+/g, '_')}.pdf`, nums };
  });
}
async function subirBlob(chequeId, tipo, blob, nombre) {
  const path = `${chequeId}/${tipo}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}.pdf`;
  const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: 'application/pdf' });
  if (up.error) throw up.error;

}
function bajarBlob(blob, nombre) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();

}

const FIRMA_W = 460, FIRMA_H = 280;
// Recorta lo dibujado y lo acomoda centrado en un lienzo transparente de proporción fija (46 x 28 mm en el folio).
function normalizarFirma(src) {
  const w = src.width, h = src.height, d = src.getContext('2d').getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1, pad = 10, r = Math.min((FIRMA_W - 2 * pad) / bw, (FIRMA_H - 2 * pad) / bh);
  const out = document.createElement('canvas'); out.width = FIRMA_W; out.height = FIRMA_H;
  out.getContext('2d').drawImage(src, x0, y0, bw, bh, (FIRMA_W - bw * r) / 2, (FIRMA_H - bh * r) / 2, bw * r, bh * r);
  return out.toDataURL('image/png');
}
function firmaDesdeImagen(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const r = Math.min(1, 1000 / Math.max(im.naturalWidth, im.naturalHeight)), w = Math.round(im.naturalWidth * r), h = Math.round(im.naturalHeight * r);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const cx = cv.getContext('2d'); cx.drawImage(im, 0, 0, w, h);
      const id = cx.getImageData(0, 0, w, h), p = id.data;
      for (let i = 0; i < p.length; i += 4) { const lum = (p[i] + p[i + 1] + p[i + 2]) / 3; if (p[i + 3] > 0 && lum > 215) p[i + 3] = 0; else if (p[i + 3] > 0 && lum > 150) p[i + 3] = Math.round(p[i + 3] * (215 - lum) / 65); }
      cx.putImageData(id, 0, 0); URL.revokeObjectURL(url); res(normalizarFirma(cv));
    };
    im.onerror = () => rej(new Error('No se pudo leer la imagen.')); im.src = url;
  });
}
function dlgFirma() {
  openModal(`<h2 style="margin-top:0">Mi firma</h2>
    <div class="mut sm">Se imprime junto a “Solicitó” en los folios que genera el sistema, solo cuando tú eres quien solicita. Solo tú la ves.</div>
    ${S.firma ? `<div class="card" style="margin-top:10px"><div class="mut sm">Firma guardada</div><img id="firmaAct" src="${S.firma}" style="max-width:230px;max-height:140px;display:block;margin-top:6px;background:#fff"></div>` : ''}
    <label class="f">Dibújala aquí con el dedo o el mouse</label>
    <canvas id="firmaPad" width="${FIRMA_W}" height="${FIRMA_H}" style="width:100%;max-width:340px;aspect-ratio:${FIRMA_W}/${FIRMA_H};border:1px dashed #98a2b3;border-radius:8px;background:#fff;touch-action:none;display:block"></canvas>
    <div class="row" style="margin-top:10px"><button class="btn gold" data-act="firmaguardar">Guardar firma dibujada</button><button class="btn ghost" data-act="firmalimpiar">Borrar trazo</button></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="firmafoto">O sube una imagen de tu firma</button></div>`);
  const cv = $('#firmaPad'), cx = cv.getContext('2d'); let dib = false;
  cx.lineWidth = 5; cx.lineCap = cx.lineJoin = 'round'; cx.strokeStyle = '#0a0a2a';
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * FIRMA_W / r.width, (e.clientY - r.top) * FIRMA_H / r.height]; };
  cv.onpointerdown = e => { dib = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x + 0.01, y + 0.01); cx.stroke(); };
  cv.onpointermove = e => { if (!dib) return; const [x, y] = pos(e); cx.lineTo(x, y); cx.stroke(); };
  cv.onpointerup = cv.onpointercancel = () => { dib = false; };
}

    <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px"><button class="btn gold" data-act="prevprint">Imprimir</button><button class="btn ghost" data-act="prevdl">Descargar PDF</button><button class="btn ghost" data-act="prevopen">Abrir en otra pestaña</button></div>
    <div class="mut sm" style="margin-top:6px">Revisa cómo quedó antes de imprimir. Si en el celular no se ve aquí, usa “Abrir en otra pestaña”.</div>`);
}
/* ===================== POLIZA PDF ===================== */
async function polizaPDF(id) {
  let c; try { c = await loadCheque(id); } catch (e) { return toast(errMsg(e), 'err'); }
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: 'letter' });
  const LIL = [241, 208, 236], PW = 215.9, FX = 5.5, FW = PW - 2 * 5.5, BX = 13.6, BW = PW - 2 * 13.6, RH = 4.8, FONT = 'times';
  const fechaLarga = (() => { const [y, m, d] = String(c.fecha).slice(0, 10).split('-'); const M = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre']; return `${Number(d)} de ${M[Number(m) - 1]} de ${y}`; })();
  const letra = montoLetra(c.monto).replace(/ M\.N\.$/, 'MN').replace(/ DE PESOS /, ' PESOS ');
  const importe = Number(c.monto || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const parts = String(chequeraNombre(c.chequera_id) || '').trim().split(/\s+/); const banco = parts.length > 1 ? parts.pop() : ''; const empresa = parts.join(' ');
  let y = 8.8, pageTop = 4.2;
  const box = (rows, draw) => { // rows: array of heights; draw(i, yTop, h)
    const top = y, tot = rows.reduce((a, b) => a + b, 0); let yy = top;
    rows.forEach((h, i) => { if (i % 2 === 0) { doc.setFillColor(...LIL); doc.rect(BX, yy, BW, h, 'F'); } if (draw) draw(i, yy, h); yy += h; });
    doc.setDrawColor(0); doc.setLineWidth(0.5); doc.rect(BX, top, BW, tot); y = top + tot;
  };
  const txt = (t, x, yy, h, size, bold, opt) => { doc.setFont(FONT, bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(0); doc.text(String(t), x, yy + h / 2 + size * 0.1235, opt); };
  const frame = (bottom) => { doc.setDrawColor(0); doc.setLineWidth(0.5); doc.rect(FX, pageTop, FW, bottom - pageTop + 4.2); };
  // --- Recuadro 1: datos de la póliza ---
  box(Array(10).fill(RH), (i, yy, h) => {
    if (i === 0) txt('CHEQUE POLIZA', BX + 8, yy, h, 11, true);
    if (i === 1) { txt('FECHA', 126.5, yy, h, 10, true); txt(fechaLarga, 150.6, yy, h, 9.5, true); }
    if (i === 3) { txt(c.beneficiario, BX + 0.8, yy, h, c.beneficiario.length > 55 ? 7.5 : 9, true); txt('$', 148.5, yy, h, 9, true); txt(importe, 190, yy, h, 9, true, { align: 'right' }); }
    if (i === 5) txt('(' + letra + ')', BX + 0.8, yy, h, 8.5, true);
  });
  // --- Recuadro 2: cheque y chequera ---
  y += 4.6;
  box([4.4, 4.6, 6.2, 6, 4.7], (i, yy, h) => {
    if (i === 1) { txt('CHEQUE', BX + 0.8, yy, h, 12, true); txt(c.numero_cheque, BX + 25, yy, h, 12, false); }
    if (i === 2) txt(empresa || banco, BX + 0.8, yy, h, 12, true);
    if (i === 3 && empresa) txt(banco, BX + 0.8, yy, h, 12, true);
  });
  // --- Recuadro 3: vacío, como en el formato ---
  y += 4.6;
  box(Array(6).fill(RH), null);
  frame(y);
  previewPDF(doc, `Poliza_${c.numero_cheque}_${String(chequeraNombre(c.chequera_id)).replace(/[^A-Za-z0-9]+/g, '_')}_${c.beneficiario.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '_').slice(0, 25)}.pdf`, `Póliza · Cheque ${c.numero_cheque}`);
}

/* ===================== FOLIOS (SERIES) ===================== */
async function viewSeries() {
  await loadCatalogs();

  <div class="mut sm" style="margin-bottom:10px">Último folio usado en cada cargo. Cancún se asigna automático; los demás se sugieren y puedes cambiarlos (hay folios que se pagan en efectivo).</div>
  ${S.cargos.map(c => { const s = S.series[c.id] || { ultimo_numero: 0, modo: 'sugerida' }; return `<div class="card row">
    <div class="grow"><div class="b">${esc(c.nombre)}</div><div class="mut sm">${s.modo === 'automatica' ? 'Automático' : 'Sugerido'}</div></div>

/* ===================== BITACORA ===================== */
async function viewBit() {
  $('#view').innerHTML = `<div class="pagehead"><h2>Bitácora</h2><span class="sub">Últimos 150 movimientos</span></div><div id="bl" class="spin">Cargando…</div>`;
  const { data, error } = await sb.from('bitacora').select('*, cheques(poliza_numero,numero_cheque,beneficiario)').order('creado_en', { ascending: false }).limit(150);
  if (error) return $('#bl').innerHTML = `<div class="warnbox">${esc(errMsg(error))}</div>`;
  $('#bl').outerHTML = `<div class="card">${data.map(b => `<div class="log"><b>${esc(b.accion.replace(/_/g, ' '))}</b> · ${esc(b.usuario_nombre || '')} · <span class="mut">${fdt(b.creado_en)}</span>
    ${b.cheques ? `<br><a href="#" data-act="detalle" data-id="${b.cheque_id}">Cheque ${b.cheques.numero_cheque} · ${esc(b.cheques.beneficiario)}</a>` : (b.detalle && b.detalle.cargo ? `<br><span class="mut">${esc(b.detalle.cargo)}: ${b.detalle.antes} → ${b.detalle.despues}</span>` : '')}</div>`).join('') || '<span class="mut">Sin movimientos</span>'}</div>`;
}

  <h3>Cambiar contraseña</h3><label class="f">Nueva contraseña (mínimo 8 caracteres)</label>${pwField('np1', 'new-password')}<label class="f">Repítela</label>${pwField('np2', 'new-password')}

/* ===================== EVENTOS ===================== */
// Todo lo que se escribe en la app va en MAYÚSCULAS (correo y contraseña no se tocan).
document.addEventListener('input', ev => {
  const el = ev.target; if (!el.matches || !el.matches('input[type=text], textarea')) return;
  const v = el.value, u = v.toUpperCase(); if (v === u) return;
  const a = el.selectionStart, b = el.selectionEnd; el.value = u; try { el.setSelectionRange(a, b); } catch (e) {}
}, true);
document.addEventListener('click', async ev => {
  const tabBtn = ev.target.closest('nav.tabs button'); if (tabBtn) return go(tabBtn.dataset.tab);
  const el = ev.target.closest('[data-act]'); if (!el) return; const act = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'A') ev.preventDefault();
  try {
    switch (act) {
      case 'ovl': if (ev.target === el) closeModal(); break;
      case 'close': closeModal(); break;
      case 'menu': menuCuenta(); break;
      case 'verpass': { const inp = document.getElementById(el.dataset.for); const ver = inp.type === 'password'; inp.type = ver ? 'text' : 'password'; el.innerHTML = ver ? EYE_OFF : EYE; inp.focus(); break; }
      case 'instalar': {
        if (window.__pwaPrompt) { window.__pwaPrompt.prompt(); await window.__pwaPrompt.userChoice; window.__pwaPrompt = null; break; }
        const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
        openModal(`<h2 style="margin-top:0">Instalar la app</h2>` + (ios
          ? '<div class="card">En iPhone: abre esta página en <b>Safari</b>, toca el botón <b>Compartir</b> (cuadro con flecha hacia arriba) y elige <b>Agregar a pantalla de inicio</b>.</div>'
          : '<div class="card">En Android (Chrome): toca los <b>tres puntos</b> de arriba a la derecha y elige <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.<br><br>En computadora (Chrome): ícono de instalar al final de la barra de direcciones.</div>')
          + '<div class="mut sm">Si ya está instalada, ábrela desde su ícono en la pantalla de inicio.</div>'); break; }
      case 'salir': await sb.auth.signOut(); S.perfil = null; closeModal(); renderLogin(); break;
      case 'cambiarpass': {
        const a = $('#np1').value, b = $('#np2').value; if (a.length < 8) return toast('Mínimo 8 caracteres.', 'err'); if (a !== b) return toast('No coinciden.', 'err');
        const { error } = await sb.auth.updateUser({ password: a }); if (error) return toast(errMsg(error), 'err'); toast('Contraseña actualizada.', 'ok'); closeModal(); break; }
      case 'prevprint': { const f = $('#pdfFrame'); try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { window.open(S.prev.url, '_blank'); } break; }
      case 'prevdl': bajarBlob(S.prev.blob, S.prev.nombre); break;
      case 'prevopen': window.open(S.prev.url, '_blank'); break;
      case 'detalle': openDetail(id); break;
      case 'enterar': { el.disabled = true; await rpc('enterar_cancelacion', { p_id: id }); toast('Cancelación confirmada.', 'ok'); refreshView(); break; }
      case 'mas': loadList(false); break;
      case 'poliza': polizaPDF(id); break;
      case 'verarch': { const c = await loadCheque(id); const a = archActivos(c, el.dataset.tipo)[0]; if (a) abrirPath(a.path); break; }
      case 'verpath': abrirPath(el.dataset.path); break;
      case 'autorizar': { const c = await loadCheque(id); dlgAutorizar(id, c); break; }
      case 'okautorizar': { el.disabled = true; await rpc('autorizar_cheque', { p_id: id, p_comentario: $('#cmt').value }); closeModal(); toast('Cheque autorizado.', 'ok'); refreshView(); break; }
      case 'rechazar': dlgMotivo('Rechazar cheque', 'okrechazar', id, 'bad', 'Rechazar'); break;
      case 'okrechazar': { const m = $('#mot').value.trim(); if (!m) return toast('Escribe el motivo.', 'err'); await rpc('rechazar_cheque', { p_id: id, p_motivo: m }); closeModal(); toast('Cheque rechazado.', 'ok'); refreshView(); break; }
      case 'cancelar': dlgMotivo('Cancelar cheque', 'okcancelar', id, 'bad', 'Cancelar cheque'); break;
      case 'okcancelar': { const m = $('#mot').value.trim(); if (!m) return toast('Escribe el motivo.', 'err'); await rpc('cancelar_cheque', { p_id: id, p_motivo: m }); closeModal(); toast('Cheque cancelado; sus folios quedaron libres.', 'ok'); refreshView(); break; }
      case 'cobrar': {
        const c = await loadCheque(id);
        if (!archActivos(c, 'comprobante_cobro').length) { openModal(`<h2 style="margin-top:0">Falta el comprobante</h2><div class="warnbox">Sube primero el comprobante de que el cheque fue cobrado o depositado.</div><div class="row"><button class="btn gold" data-act="subir" data-id="${id}" data-tipo="comprobante_cobro">Subir comprobante</button><button class="btn ghost" data-act="close">Cerrar</button></div>`); break; }
        openModal(`<h2 style="margin-top:0">Marcar como cobrado</h2><label class="f">Fecha de cobro</label><input type="date" id="fc" value="${today()}"><div class="row" style="margin-top:14px"><button class="btn ok grow" data-act="okcobrar" data-id="${id}">Confirmar</button><button class="btn ghost" data-act="close">Volver</button></div>`); break; }
      case 'okcobrar': await rpc('marcar_cobrado', { p_id: id, p_fecha_cobro: $('#fc').value, p_cobrado: true }); closeModal(); toast('Cheque marcado como cobrado.', 'ok'); refreshView(); break;
      case 'descobrar': await rpc('marcar_cobrado', { p_id: id, p_fecha_cobro: null, p_cobrado: false }); toast('Cobro desmarcado.', 'ok'); openDetail(id); refreshView(true); break;
      case 'subir': {
        const files = await pickFiles(true); if (!files.length) break; toast('Subiendo…');
        await subirArchivo(id, el.dataset.tipo, files); toast('Documento guardado.', 'ok'); openDetail(id); refreshView(true); break; }
      case 'quitar': dlgMotivo('Quitar documento', 'okquitar', id, 'bad', 'Quitar'); break;
      case 'okquitar': { const m = $('#mot').value.trim(); if (!m) return toast('Escribe el motivo.', 'err'); await rpc('quitar_archivo', { p_archivo: id, p_motivo: m }); toast('Documento quitado.', 'ok'); closeModal(); refreshView(true); break; }
      case 'editar': { const c = await loadCheque(id); closeModal(); S.F = null; S.tab = 'nuevo'; document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === 'nuevo')); await viewNuevo(c); window.scrollTo(0, 0); break; }
      case 'cancelado': dlgCancelado(); break;
      case 'okcancelado': {
        const ch = Number($('#cc_ch').value), num = Number($('#cc_num').value), fe = $('#cc_fecha').value, mo = $('#cc_mot').value.trim();
        if (!ch || !num || !fe || !mo) return toast('Llena chequera, número, fecha y motivo.', 'err');
        el.disabled = true; const c = await rpc('registrar_cheque_cancelado', { p_chequera: ch, p_numero: num, p_fecha: fe, p_motivo: mo });
        let warn = ''; if (ccFiles.length) { try { await subirArchivo(c.id, 'otro', ccFiles); } catch (e) { warn = errMsg(e); } }
        ccFiles = []; closeModal(); toast(`Cheque ${num} registrado como cancelado.` + (warn ? ' La foto no se pudo subir.' : ''), warn ? 'err' : 'ok'); refreshView(); break; }
      case 'ccfoto': { ccFiles = await pickFiles(true); $('#ccInfo').textContent = ccFiles.length ? ccFiles.length + ' archivo(s)' : 'Sin foto'; break; }
      case 'huecos': {
        openModal('<div class="spin">Revisando…</div>');
        const res = await Promise.all(S.chequeras.map(async q => ({ q, h: await rpc('huecos_chequera', { p_chequera: q.id }) })));
        const con = res.filter(r => r.h.length);
        openModal(`<h2 style="margin-top:0">Huecos de numeración</h2>` + (con.length ? con.map(r => `<div class="card"><div class="b">${esc(r.q.nombre)}</div><div class="warnbox">Faltan los cheques: ${r.h.join(', ')}.<br>Regístralos como emitidos o como cancelados.</div></div>`).join('') : '<div class="okbox">No hay huecos: todas las chequeras llevan numeración continua desde el primer cheque capturado.</div>') + '<div class="mut sm">Se revisa desde el primer cheque capturado en el sistema (el historial no cuenta).</div>'); break; }
      case 'cancelarEdit': S.F = null; go('cheques'); break;
      case 'otro': closeModal(); S.F = null; go('nuevo'); break;
      case 'modo': { const l = S.F.lines[Number(el.dataset.i)]; l.modo = el.dataset.m; renderLines(); break; }
      case 'pickfolio': { const fs = await pickFiles(true); S.F.folioFiles = fs; $('#folInfo').textContent = fs.length ? fs.length + ' archivo(s) listo(s) para subir' : 'Sin adjuntar'; break; }
      case 'dlfolio': { const hj = (S.hojas || [])[Number(el.dataset.i)]; if (hj) bajarBlob(hj.blob || hj.doc.output('blob'), hj.nombre); break; }
      case 'firma': dlgFirma(); break;
      case 'firmalimpiar': { const cv = $('#firmaPad'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); break; }
      case 'firmaguardar': { await guardarFirma(normalizarFirma($('#firmaPad'))); break; }
      case 'firmafoto': { const fs = await pickFiles(false); if (!fs.length) break; if (!/^image\//.test(fs[0].type)) return toast('Elige una imagen (foto o PNG).', 'err'); await guardarFirma(await firmaDesdeImagen(fs[0])); break; }
      case 'addline': S.F.lines.push(newLine()); renderLines(); break;
      case 'rmline': S.F.lines.splice(Number(el.dataset.i), 1); renderLines(); break;
      case 'resto': {
        const F = S.F, i = Number(el.dataset.i); const tot = cents(parseMoney(F.h.monto) || 0);
        const otros = F.lines.reduce((a, l, j) => j === i ? a : a + cents(parseMoney(l.monto) || 0), 0); const falta = tot - otros;
        if (falta > 0) { F.lines[i].monto = (falta / 100).toFixed(2); renderLines(); } else toast('No falta nada por repartir.', 'err'); break; }
      case 'pickfac': { const files = await pickFiles(true); S.F.files = files; $('#facInfo').textContent = files.length ? files.length + ' archivo(s) listo(s) para subir' : 'Sin adjuntar'; break; }
      case 'guardar': guardarCheque(); break;
      case 'saveserie': {
        const v = Number($('#ser_' + id).value); await rpc('ajustar_serie', { p_cargo_id: Number(id), p_ultimo: v }); toast('Serie actualizada.', 'ok'); await loadCatalogs(); break; }
    }
  } catch (e) { toast(errMsg(e), 'err'); const b = el.tagName === 'BUTTON' ? el : null; if (b) b.disabled = false; }
});
function refreshView(soft) {
  if (S.tab === 'pend') viewPend(); else if (S.tab === 'cheques') loadList(true); else if (S.tab === 'bit') viewBit();
  refreshPendCount();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__pwaPrompt = e; });
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => {});
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && S.perfil) { S.perfil = null; renderLogin(); } });
boot();
